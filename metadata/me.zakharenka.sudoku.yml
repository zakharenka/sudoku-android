MaintainerNotes: |
  The app targets SDK 37 and builds with AGP 9.4.1 / Gradle 9.6.
  A recent F-Droid buildserver is required. Version name and code are
  derived from app.version in gradle.properties, so UpdateCheckMode is
  Static: bump the property, tag the release commit and add a new Builds
  entry manually for every release. Fastlane store texts and graphics are
  kept in fastlane/metadata/android/.

